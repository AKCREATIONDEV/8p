name: Build Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract Project ZIP
        run: |
          mkdir -p project

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" \
            ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          echo "ZIP: $ZIP"

          unzip -q "$ZIP" -d project

          ROOT=$(find project \
            -type f \
            -name gradlew \
            -not -path "*/.gradle/*" \
            -print -quit)

          if [ -z "$ROOT" ]; then
            echo "ERROR: gradlew not found inside ZIP!"
            find project -maxdepth 5 -type f | head -200
            exit 1
          fi

          ROOT=$(dirname "$ROOT")

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "Project root:"
          echo "$ROOT"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34 and NDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "ndk;24.0.8215888"

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Show Project
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "================================"
          echo "Project Root:"
          pwd
          echo "================================"

          echo "Files:"
          ls -la

          echo "================================"
          echo "Gradle Version:"
          ./gradlew --version

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleRelease --stacktrace

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find "${{ env.PROJECT_ROOT }}" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/*" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK
          path: ${{ env.APK }}
          if-no-files-found: error
