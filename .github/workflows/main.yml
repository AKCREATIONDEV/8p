name: Build Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract Project ZIP
        run: |
          mkdir -p project

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" \
            ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          echo "ZIP found: $ZIP"

          unzip -q "$ZIP" -d project

          ROOT=$(find project \
            -type f \
            -name gradlew \
            -not -path "*/.gradle/*" \
            -print -quit)

          if [ -z "$ROOT" ]; then
            echo "ERROR: gradlew not found inside ZIP!"
            exit 1
          fi

          ROOT=$(dirname "$ROOT")

          echo "Original project root:"
          echo "$ROOT"

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34 and NDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "ndk;24.0.8215888"

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Prepare Build Directory
        run: |
          BUILD_ROOT="$RUNNER_TEMP/android_project"

          rm -rf "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT"

          cp -a "${{ env.PROJECT_ROOT }}/." "$BUILD_ROOT/"

          echo "BUILD_ROOT=$BUILD_ROOT" >> "$GITHUB_ENV"

          echo "Build project:"
          echo "$BUILD_ROOT"

      - name: Verify Native Build Files
        run: |
          echo "Checking Android.mk..."

          if [ ! -f "$BUILD_ROOT/app/src/main/jni/Android.mk" ]; then
            echo "ERROR: Android.mk not found!"
            exit 1
          fi

          if [ ! -f "$BUILD_ROOT/app/src/main/jni/Application.mk" ]; then
            echo "ERROR: Application.mk not found!"
            exit 1
          fi

          echo "Android.mk:"
          ls -l "$BUILD_ROOT/app/src/main/jni/Android.mk"

          echo "Application.mk:"
          ls -l "$BUILD_ROOT/app/src/main/jni/Application.mk"

          echo "Native directory:"
          ls -la "$BUILD_ROOT/app/src/main/jni"

      - name: Make Gradle Executable
        working-directory: ${{ env.BUILD_ROOT }}
        run: |
          chmod +x gradlew
          ls -l gradlew

      - name: Show Gradle Version
        working-directory: ${{ env.BUILD_ROOT }}
        run: |
          ./gradlew --version

      - name: Clean
        working-directory: ${{ env.BUILD_ROOT }}
        run: |
          ./gradlew clean --stacktrace

      - name: Build Release APK
        working-directory: ${{ env.BUILD_ROOT }}
        run: |
          ./gradlew assembleRelease --stacktrace --info

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find "$BUILD_ROOT" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/*" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated!"

            echo "Searching build outputs..."
            find "$BUILD_ROOT" \
              -type f \
              -path "*/build/outputs/*" \
              -print

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK
          path: ${{ env.APK }}
          if-no-files-found: error
