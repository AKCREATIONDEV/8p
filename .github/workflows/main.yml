name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK/NDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "ndk;24.0.8215888"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" \
            ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No project ZIP found."
            exit 1
          fi

          echo "ZIP found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          rm -rf "$RUNNER_TEMP/android-project"
          mkdir -p "$RUNNER_TEMP/android-project"

          unzip -q "${{ steps.find_zip.outputs.zip }}" \
            -d "$RUNNER_TEMP/android-project"

      - name: Find Gradle project automatically
        id: find_project
        shell: bash
        run: |
          PROJECT_ROOT=$(find "$RUNNER_TEMP/android-project" \
            -type f -name "gradlew" \
            -not -path "*/.gradle/*" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_ROOT" ] || [ ! -f "$PROJECT_ROOT/gradlew" ]; then
            echo "Could not find Gradle project."
            echo "Searching extracted files:"
            find "$RUNNER_TEMP/android-project" -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_ROOT=$(cd "$PROJECT_ROOT" && pwd)

          echo "Gradle project found:"
          echo "$PROJECT_ROOT"

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Make Gradle executable
        working-directory: ${{ steps.find_project.outputs.project_root }}
        run: chmod +x gradlew

      - name: Show project information
        working-directory: ${{ steps.find_project.outputs.project_root }}
        run: |
          echo "===== Gradle version ====="
          ./gradlew --version

          echo "===== Project files ====="
          ls -la

      - name: Build Release APK
        working-directory: ${{ steps.find_project.outputs.project_root }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.find_project.outputs.project_root }}" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/*" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
